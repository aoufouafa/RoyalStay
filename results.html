<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Royal Stay - Search Results</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell results-screen">
    <div class="ios-statusbar" aria-hidden="true"><span>9:41</span><span class="ios-indicators"><span>▮▮▮</span><span>◔</span><span class="ios-battery"></span></span></div>
    <header class="topbar compact results-topbar">
      <a class="icon-btn" href="home.html" aria-label="Back to search">‹</a>
      <div class="results-heading">
        <strong>Search results</strong>
        <small>Find a stay that fits your trip and budget.</small>
      </div>
      <span></span>
    </header>
    <section class="results-content">
      <div class="filter-chips" role="group" aria-label="Search result filters">
        <button class="active" type="button" aria-pressed="true">All</button>
        <button type="button" aria-pressed="false">Price ↓</button>
        <button type="button" aria-pressed="false">Rating</button>
        <button type="button" aria-pressed="false">Location</button>
      </div>
      <article class="results-hotel-card">
        <div class="results-card-main">
          <img src="assets/images/hotel1.jpg" alt="Hotel exterior">
          <div class="results-card-info">
            <h2>Hotel name</h2>
            <p>⌖ Location</p>
            <span class="results-rating">4.8 <b>★</b></span>
            <p class="results-price">1000 DZ</p>
          </div>
        </div>
        <a class="results-details-btn" href="hotel_details.html">View details <span>→</span></a>
      </article>
      <article class="results-hotel-card">
        <div class="results-card-main">
          <img src="assets/images/hotel2.jpg" alt="Beachfront hotel exterior">
          <div class="results-card-info">
            <h2>Hotel name</h2>
            <p>⌖ Location</p>
            <span class="results-rating">4.6 <b>★</b></span>
            <p class="results-price">1000 DZ</p>
          </div>
        </div>
        <a class="results-details-btn" href="hotel_details.html">View details <span>→</span></a>
      </article>
    </section>
    <nav class="bottom-nav">
      <a href="home.html"><span>⌂</span>Home</a>
      <a class="active" href="results.html"><span>⌕</span>Search</a>
      <a href="reservation.html"><span>▦</span>Reservations</a>
    </nav>
  </main>
</body>
</html>
