<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Royal Stay - Reservation Details</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell reservation-details-screen">
    <div class="ios-statusbar" aria-hidden="true"><span>9:41</span><span class="ios-indicators"><span>▮▮▮</span><span>◔</span><span class="ios-battery"></span></span></div>
    <header class="topbar compact">
      <a class="icon-btn" href="reservation.html" aria-label="Back to reservations">‹</a>
      <strong>Reservation Details</strong>
      <span></span>
    </header>
    <section class="reservation-details-content">
      <img class="reservation-details-photo" src="assets/images/hotel1.jpg" alt="Hotel Luxe exterior">
      <article class="reservation-details-card">
        <h1>Hotel Luxe</h1>
        <p class="reservation-location">Los Angeles, California</p>
        <div class="reservation-reference">
          <span>Reservation reference</span>
          <strong>RS-2026-12012</strong>
        </div>
        <span class="reservation-status">Confirmed</span>
        <div class="reservation-facts">
          <div><span>Check-in</span><strong>12/12/2026</strong></div>
          <div><span>Check-out</span><strong>15/12/2026</strong></div>
          <div class="reservation-total"><span>Total</span><strong>$540</strong></div>
        </div>
        <button class="cancel-reservation-btn" type="button">Cancel reservation</button>
      </article>
    </section>
  </main>
</body>
</html>
